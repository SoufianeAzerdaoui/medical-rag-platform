services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    env_file:
      - .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      PROD_READINESS_ENFORCE: ${PROD_READINESS_ENFORCE:-false}
      MEDICAL_RAG_PLANNER_SHADOW_MODE: ${MEDICAL_RAG_PLANNER_SHADOW_MODE:-1}
      MEDICAL_RAG_PLANNER_ENABLE_TAKEOVER: ${MEDICAL_RAG_PLANNER_ENABLE_TAKEOVER:-0}
      APP_DB_PATH: ${APP_DB_PATH:-/app/data/app_state.sqlite3}
      LOGS_DIR: ${LOGS_DIR:-/app/logs}
    ports:
      - "8000:8000"
    volumes:
      - medical-rag-data:/app/data
      - medical-rag-logs:/app/logs
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        NEXT_PUBLIC_RAG_API_URL: ${NEXT_PUBLIC_RAG_API_URL}
    environment:
      NODE_ENV: production
      NEXT_DIST_DIR: .next-build
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend

volumes:
  medical-rag-data:
  medical-rag-logs:
